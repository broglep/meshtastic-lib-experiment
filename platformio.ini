; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino

build_flags =
              -Wno-missing-field-initializers
              -Wno-format
              -Isrc -Isrc/mesh -Wl,-Map,.pio/build/output.map

              -DUSE_THREAD_NAMES

              -DPB_ENABLE_MALLOC=1

              -DDEBUGLOG_DEFAULT_LOG_LEVEL_DEBUG=1

              #-DRADIOLIB_DEBUG_SPI=1
              #-DRADIOLIB_DEBUG_PROTOCOL=1
              #-DRADIOLIB_DEBUG_BASIC=1

              -DRADIOLIB_EXCLUDE_CC1101=1
              -DRADIOLIB_EXCLUDE_NRF24=1
              -DRADIOLIB_EXCLUDE_RF69=1
              -DRADIOLIB_EXCLUDE_SX1231=1
              -DRADIOLIB_EXCLUDE_SX1233=1
              -DRADIOLIB_EXCLUDE_SI443X=1
              -DRADIOLIB_EXCLUDE_RFM2X=1
              -DRADIOLIB_EXCLUDE_AFSK=1
              -DRADIOLIB_EXCLUDE_BELL=1
              -DRADIOLIB_EXCLUDE_HELLSCHREIBER=1
              -DRADIOLIB_EXCLUDE_MORSE=1
              -DRADIOLIB_EXCLUDE_RTTY=1
              -DRADIOLIB_EXCLUDE_SSTV=1
              -DRADIOLIB_EXCLUDE_AX25=1
              -DRADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
              -DRADIOLIB_EXCLUDE_BELL=1
              -DRADIOLIB_EXCLUDE_PAGER=1
              -DRADIOLIB_EXCLUDE_FSK4=1
              -DRADIOLIB_EXCLUDE_APRS=1
              -DRADIOLIB_EXCLUDE_LORAWAN=1

              -DMESHTASTIC_EXCLUDE_DROPZONE=1
              -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
              -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
              -DMESHTASTIC_EXCLUDE_POWERSTRESS=1 ; exclude power stress test module from main firmware

monitor_filters =
    esp32_exception_decoder

lib_deps =
; jgromes/RadioLib@7.1.0
    nanopb/Nanopb@0.4.91
    jgromes/RadioLib@7.1.2
    rweather/Crypto@^0.4.0


    https://github.com/meshtastic/ArduinoThread.git#1ae8778c85d0a2a729f989e0b1e7d7c4dc84eef0
    DebugLog



upload_port = /dev/cu.usbserial-1
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-1